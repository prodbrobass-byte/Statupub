<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacter sur WhatsApp · StatuPub</title>
<meta name="robots" content="noindex">
<meta name="description" content="Écris directement à ce commerçant sur WhatsApp.">
<link rel="icon" href="/logo/statupub-icone-1024.png">
<style>
:root{--green:#0E3B36;--saff:#E8A33D;--cream:#F3F1EA;--ink:#17201E;--wa:#1FA855}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:32px 24px;box-shadow:0 10px 40px rgba(14,59,54,.12);text-align:center}
.av{width:84px;height:84px;border-radius:50%;background:var(--green);color:var(--saff);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2.2rem;font-weight:800}
h1{margin:0 0 6px;font-size:1.5rem;line-height:1.2}
p{margin:0 0 22px;color:#55625F;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:999px;background:var(--wa);color:#fff;font-weight:700;font-size:1.1rem;text-decoration:none}
.btn svg{width:26px;height:26px}
.err{color:#B3261E}
.foot{margin-top:22px;font-size:.8rem;color:#8A9592}
.foot a{color:var(--green)}
</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
fbq("init","1081784291417409");fbq("track","PageView");
</script>
</head>
<body>
<main class="card" id="c">
  <div class="av" id="av">?</div>
  <h1 id="name">Contacter sur WhatsApp</h1>
  <p id="txt">Écris directement au vendeur pour commander ou poser tes questions.</p>
  <a class="btn" id="go" href="#" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
    Écrire sur WhatsApp
  </a>
  <div class="foot">Pub diffusée avec <a href="/">StatuPub</a></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var n = (q.get("n") || "").replace(/\D/g, "");
  var b = (q.get("b") || "").trim().slice(0, 80);
  var m = (q.get("m") || ("Bonjour" + (b ? " " + b : "") + ", je viens de votre pub. ")).slice(0, 300);
  if (b) { document.getElementById("name").textContent = b; document.getElementById("av").textContent = b.charAt(0).toUpperCase(); document.title = b + " · WhatsApp"; }
  var go = document.getElementById("go");
  if (n.length < 8 || n.length > 15) {
    go.style.display = "none";
    var t = document.getElementById("txt"); t.className = "err"; t.textContent = "Lien incomplet : numéro WhatsApp manquant.";
    return;
  }
  go.href = "https://wa.me/" + n + "?text=" + encodeURIComponent(m);
  // Compteur StatuPub (indépendant de Meta) : 1 vue et 1 contact au plus par personne et par jour
  var vid = "";
  try { vid = localStorage.getItem("sp_vid") || ""; if (!vid) { vid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); localStorage.setItem("sp_vid", vid); } } catch (e) { vid = String(Math.random()).slice(2) + Date.now(); }
  var log = function (kind) {
    try {
      fetch("https://zqqtqopcrlxvsxvqmfjo.supabase.co/rest/v1/rpc/log_wa_event", { method: "POST", keepalive: true,
        headers: { "Content-Type": "application/json", apikey: "sb_publishable_ELwnBEHmoxzb1NemI_nAig_YdEish0f" },
        body: JSON.stringify({ p_n: n, p_kind: kind, p_visitor: vid }) }).catch(function () {});
    } catch (e) {}
  };
  log("view");
  go.addEventListener("click", function () { try { fbq("track", "Contact"); } catch (e) {} log("click"); });
})();
</script>
</body>
</html>
